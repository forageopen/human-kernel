name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck + tests (do not deploy something CI wouldn't pass)
        run: |
          npm run typecheck
          npm run validate-schema
          npm test

      - name: Build
        run: npm run build

      # index.html references "dist/main.js" and "styles.css" - paths that are
      # only correct when index.html sits at the repo root next to a dist/
      # subfolder (the local-dev layout). Deploying dist/ itself as the site
      # root (as an earlier version of this workflow did) flattens that away
      # and 404s the script. Fix: stage a site/ folder that reproduces the
      # repo-root-plus-dist/-subfolder layout exactly, so index.html's
      # existing relative paths stay correct with zero changes to index.html.
      - name: Assemble static site (site/index.html + site/styles.css + site/dist/**, minus test output)
        run: |
          find dist -name '*.test.js' -delete
          mkdir -p site
          cp index.html styles.css site/
          cp -r dist site/dist

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
