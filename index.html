<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Human on Cloud</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital@0;1&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<!-- Forage brand fonts (forage-colorway skill, FDMAI-BRAND-001). Fallbacks in
     styles.css (Georgia/Arial/Courier New) apply if this CDN load fails. -->
<link rel="stylesheet" href="styles.css">
<!-- No Chart.js as of the 2026-08-02 rebuild - the six chart cards that used
     it were scrapped per direct instruction; the heatmap/calendar (the one
     visual that survives) is hand-drawn DOM/CSS, not canvas-based, so
     there's nothing left in this page that needs it. -->
</head>
<body>

<!-- Chrome-style tab bar (2026-08-03, Cognitive Supplement Dashboard) -
     mounted entirely by src/dashboard/tabs.ts's renderTabBar()/wireTabBar()
     from main.ts, same "nothing static needed here" convention as the scene
     taskbar below. Deliberately the very first element in <body> and a
     sibling of both panels (not nested in either) so it stays visible and
     clickable no matter which of the two panels below is currently active. -->

<div id="hk-tab1-panel">

<!-- Four independent ambient background layers (page chrome, not dashboard
     data) - fixed, behind everything, pointer-events disabled. Populated by
     main.ts via src/dashboard/particles.ts (slow drifting dots),
     src/dashboard/starchase.ts (two fast groups chasing on opposite
     diagonals), src/dashboard/sakura.ts (falling cherry-blossom petals),
     and src/dashboard/fireworks.ts (periodic radiating bursts). All four
     hidden/stopped under prefers-reduced-motion (see styles.css); the first
     three share one speed control (the scene taskbar's slider, --hk-speed) -
     fireworks' burst pacing is its own timer, not tied to that slider, and
     its color-variety slider lives in the scene taskbar too. -->
<div class="hk-particles" id="hk-particles" aria-hidden="true"></div>
<div class="hk-starchase" id="hk-starchase" aria-hidden="true"></div>
<div class="hk-sakura" id="hk-sakura" aria-hidden="true"></div>
<div class="hk-fireworks" id="hk-fireworks" aria-hidden="true"></div>

<!-- Auto-hide left scene taskbar - built and mounted entirely by
     src/dashboard/scene-panel.ts, since its whole contents (the card list)
     depend on the widget set main.ts creates. Nothing static needed here. -->

<!-- Purple 8-bit mascot - a free-roaming "cousin" of the Claude Code avatar
     (src/dashboard/mascot.ts). Hover to squint, click-and-hold to drag,
     release to have it fall like a leaf to a resting spot near the bottom
     of the viewport; that spot is remembered for next visit. -->
<div class="hk-mascot" id="hk-mascot" role="img" aria-label="A small purple mascot - drag it around"></div>

<!-- Second roaming avatar: a dog that walks across the screen on its own
     (src/dashboard/dog-avatar.ts) - autonomous, not draggable. Both this and
     the mascot above get an individual show/hide switch in the scene
     taskbar (main.ts), same mechanism as every card. -->
<div class="hk-dog" id="hk-dog" aria-hidden="true"></div>

<div class="hk-shell">

  <div class="hk-ribbon">
    <span class="hk-ribbon-brand">Human on Cloud</span>
    <!-- Static fallback text only - theme.ts's wireThemeToggle overwrites this
         on load with whichever mode is actually active (default: dark), so
         the label always names what's on screen, not what a click leads to. -->
    <button class="hk-theme-toggle" id="hk-theme-toggle" type="button">Dark mode</button>
  </div>

  <!-- GitHub-profile-style header (direct reference: uploaded screenshot of a
       GitHub profile page). Avatar is a generated 8-bit-style portrait
       (src/dashboard/avatar.ts) - hover/focus darkens it and reveals "click to
       regenerate" (hk-avatar-overlay, styles.css); a click swaps in a new one
       and remembers it for next visit. Press and hold (2026-08-03, direct
       request) rapid-cycles through avatars until released. -->
  <div class="hk-profile-header">
    <div class="hk-avatar-wrap" id="hk-avatar-wrap" tabindex="0" role="button" aria-label="Regenerate profile picture. Press and hold to cycle rapidly.">
      <div class="hk-avatar-overlay">Click to<br>regenerate<br>Hold to cycle</div>
    </div>
    <div class="hk-profile-body">
      <!-- Editable header (2026-08-03, direct request: "editable upon
           clicking, like anyone can either write their name, or can write
           any title for their project") - src/dashboard/profile-name.ts
           makes this click-to-edit, persisted in localStorage. Starts as
           "Adam Rosman" (still true until someone changes it), not
           hardcoded as non-editable - a visitor can turn it into their own
           name or a project title. -->
      <!-- role="button" (not "textbox") to match the exact same click-to-arm-
           editing interaction createWidget's editableTitle option already
           uses for Notes card titles (draggable.ts) - profile-name.ts's
           wireProfileName() overwrites this aria-label immediately on load
           with the live "<name> - click to edit" form, same pattern as
           createWidget's own aria-label upkeep. -->
      <h1 class="hk-profile-name" id="hk-profile-name" tabindex="0" role="button" aria-label="Adam Rosman - click to edit">Adam Rosman</h1>
      <div class="hk-profile-bio">Here's my virtual desktop for your day-to-day assistance. I've provided useful cards to help you stay on track. Have fun working!</div>
    </div>
  </div>

  <!-- Vault-reactive area only: rescan control, warnings, and an empty-state
       line if a vault has nothing usable in it yet. The old sample-vs-own
       source banner text ("You're looking at a real example profile...",
       "Use my own notes instead") is retired (2026-08-03, direct request) -
       render.ts's renderSourceBanner returns null for the sample view now.
       Rebuilt on every view switch/rescan - see src/dashboard/render.ts's
       top-of-file note for why the widget canvas below is deliberately NOT
       inside this element. -->
  <div id="app" class="hk-page"></div>

</div>

<!-- Free-form widget canvas: deliberately OUTSIDE .hk-shell (2026-08-02,
     direct request: "remove the boundary space so the cards can be places
     freely anywhere") - .hk-shell's centered max-width column and side
     gutters are for the page's text content, not the card scene. Living as
     a direct child of <body>, this is a plain block-level element with no
     width constraint of its own, so it spans the full viewport edge to
     edge - draggable.ts's drag-bound math (canvas.clientWidth) then gives
     cards the whole browser width to move in, not just the padded column.
     Every card (including all 5 Notes slots) is created dynamically by
     main.ts via src/dashboard/draggable.ts's createWidget - resizable
     (native `resize:both`), movable (drag the header), closable (the x
     button) and re-enableable from the scene taskbar, arrangement
     remembered per visitor. Starts empty on purpose - there is no longer
     any static per-widget markup here at all. -->
<div class="hk-canvas" id="hk-canvas"></div>

<div class="hk-shell">

  <footer class="hk-footer">
    <a href="https://github.com/adamrosmanx" target="_blank" rel="noopener">Adam Rosman</a> for <a href="https://github.com/forageopen" target="_blank" rel="noopener">Forage</a> — see <a href="https://github.com/forageopen/human-kernel#credits" target="_blank" rel="noopener">Credits</a>.
    <div class="hk-clock" id="hk-live-clock"></div>
  </footer>

</div>

<!-- Evidence detail popup - page-level (fixed position), stable across
     every re-render, so its one-time drag wiring (render.ts's renderDrawer)
     never gets re-attached. Opens on a calendar day click. -->
<div class="hk-drawer" id="hk-drawer"></div>

</div><!-- /#hk-tab1-panel -->

<!-- Tab 2: Cognitive Supplement Dashboard (Phase 0 only - see
     src/dashboard/supplements.ts's header for full scope reasoning). Black
     background is a deliberate THIRD visual mode, independent of the
     existing dark/light/feminine theme cycle (data-theme on <html>) - both
     tabs share that one attribute, so tab 2's black look is carried by the
     .hk-tab2-panel class instead, not by theme state. Hidden by default
     (hk-tab-hidden) since "dashboard" is the default active tab
     (tabs.ts's loadActiveTab); wireTabBar corrects this on load if the
     visitor's last-active tab was actually "supplements". Canvas + its own
     scene taskbar are mounted entirely by main.ts, reusing the same
     createWidget (draggable.ts) and renderScenePanel/wireScenePanel
     (scene-panel.ts) used for tab 1, unmodified - five cards
     (src/dashboard/supplement-card.ts), one per supplement in
     supplements.ts's SUPPLEMENTS list, each a taskbar-toggleable widget same
     as tab 1's Notes cards. Starts empty on purpose, same reasoning as
     #hk-canvas above. -->
<div id="hk-tab2-panel" class="hk-tab2-panel hk-tab-hidden">
  <div class="hk-canvas hk-tab2-canvas" id="hk-tab2-canvas"></div>
</div>

<!-- Reminder toasts (Cognitive Supplement Dashboard, Phase 0) - page-level,
     sibling of both panels, so a reminder stays visible no matter which tab
     is currently selected (src/dashboard/reminder.ts's startReminders takes
     this element as its toastContainer). aria-live so a toast is announced
     to screen readers as it appears, not just visually. -->
<div class="hk-reminder-toast-container" id="hk-reminder-toast-container" aria-live="polite"></div>

<script type="module" src="dist/main.js"></script>
</body>
</html>
